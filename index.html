<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="أذكار الصباح" />
  <title>أذكار الصباح · أحمد</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Facebook-style sticky top navigation -->
  <header class="fb-navbar">
    <div class="fb-navbar-inner">
      <div class="fb-brand">
        <div class="fb-logo" aria-hidden="true">أ</div>
        <div class="fb-brand-text">
          <span class="fb-brand-title">أذكار الصباح</span>
          <span class="fb-brand-sub">أحمد</span>
        </div>
      </div>

      <div class="fb-nav-tabs" role="tablist" aria-label="تصفية الأذكار">
        <button class="fb-nav-tab is-active" data-filter="all" role="tab" aria-selected="true" type="button">
          الكل
          <span class="tab-badge" id="badge-all">16</span>
        </button>
        <button class="fb-nav-tab" data-filter="remaining" role="tab" aria-selected="false" type="button">
          المتبقي
          <span class="tab-badge" id="badge-remaining">16</span>
        </button>
        <button class="fb-nav-tab" data-filter="completed" role="tab" aria-selected="false" type="button">
          المكتمل
          <span class="tab-badge" id="badge-completed">0</span>
        </button>
      </div>

      <div class="fb-nav-actions">
        <button class="fb-circle-btn install-btn" id="install-btn" type="button" aria-label="تثبيت التطبيق" title="تثبيت التطبيق" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"></path>
            <path d="M7 10l5 5 5-5"></path>
            <path d="M5 19h14"></path>
          </svg>
        </button>

        <button class="fb-circle-btn" id="reset-all-btn" type="button" aria-label="تصفير جميع الأذكار" title="تصفير جميع الأذكار">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>

        <button class="fb-circle-btn" id="theme-toggle" type="button" aria-label="تبديل الوضع الليلي والنهاري" title="تبديل المظهر">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="fb-feed">
    <!-- Facebook-style greeting / daily status composer card -->
    <section class="fb-card fb-status-card" aria-label="ملخص أذكار الصباح">
      <div class="fb-status-top">
        <div class="fb-avatar fb-avatar-user" aria-hidden="true">أ</div>
        <div class="fb-status-greeting">
          <h1>صباح الخير يا أحمد</h1>
          <p id="today-date">أذكار الصباح اليومية</p>
        </div>
        <div class="fb-percent-pill" id="overall-percent">0%</div>
      </div>

      <div class="fb-progress-wrap">
        <div class="fb-progress-track">
          <div class="fb-progress-fill" id="overall-progress-bar" style="width: 0%"></div>
        </div>
        <div class="fb-progress-meta">
          <span id="overall-completed-text">أنجزت 0 من 16 ذكرًا</span>
          <span id="total-taps-text">إجمالي التسبيحات: 0</span>
        </div>
      </div>

      <!-- Mobile filter tabs inside card -->
      <div class="fb-mobile-tabs" role="tablist" aria-label="تصفية الأذكار للموبايل">
        <button class="fb-pill-tab is-active" data-filter="all" type="button">الكل</button>
        <button class="fb-pill-tab" data-filter="remaining" type="button">المتبقي</button>
        <button class="fb-pill-tab" data-filter="completed" type="button">المكتمل</button>
      </div>
    </section>

    <!-- Completion celebration card -->
    <section class="fb-card fb-celebration" id="celebration-card" hidden>
      <div class="fb-celebration-icon" aria-hidden="true">✓</div>
      <h2>تقبّل الله منك يا أحمد</h2>
      <p>أتممت جميع أذكار الصباح اليوم بحمد الله. جعلك الله في حفظه ورعايته.</p>
      <button class="fb-primary-btn" id="restart-btn" type="button">بدء ورد جديد</button>
    </section>

    <!-- Adhkar feed container (each dhikr rendered as a Facebook post card) -->
    <section class="fb-posts" id="adhkar-feed" aria-live="polite"></section>

    <!-- Empty filter state -->
    <section class="fb-card fb-empty-state" id="empty-state" hidden>
      <p id="empty-state-text">لا توجد أذكار في هذا القسم حاليًا.</p>
    </section>
  </main>

  <!-- Toast notification -->
  <div class="fb-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
